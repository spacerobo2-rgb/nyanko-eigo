*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#bfe8ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:#2a211a;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;min-height:100svh;background:#d7efff;padding-bottom:env(safe-area-inset-bottom)}
.screen{display:none}.screen.on{display:block}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:5px;align-items:center;padding:calc(7px + env(safe-area-inset-top)) 7px 7px;background:linear-gradient(#a96b31,#6c3d1d);border-bottom:4px solid #3e2515}
.logo{color:white;font-weight:1000;font-size:17px;text-shadow:0 2px #321b10;line-height:1.1}
.topStage{background:#fff0be;border:2px solid #5a351c;border-radius:10px;padding:5px;text-align:center;font-weight:1000;font-size:10px;line-height:1.2}
.coinTop{background:#2f251d;color:#fff4a3;border:2px solid #6e4a27;border-radius:18px;padding:7px 4px;text-align:center;font-weight:1000;font-size:13px}
.home,.map,.clear,.learn{padding:12px;min-height:calc(100svh - 65px);background:linear-gradient(#a9e2ff,#7bc3f1 38%,#9ed76b 38%)}
.panel{background:linear-gradient(#fffaf0,#f6e4ba);border:4px solid #5c361c;border-radius:17px;box-shadow:0 5px 0 #3a2417;padding:14px}
.heroTitle{font-size:26px;font-weight:1000;text-align:center}.heroSub{text-align:center;font-weight:900;line-height:1.55;font-size:14px}
.heroCats{display:flex;justify-content:center;gap:6px;margin:12px 0}
.heroCats div{width:31%;height:105px;border-radius:12px;background-size:cover;background-position:center;background-repeat:no-repeat;border:2px solid #73461f}
.mainBtn,.subBtn{width:100%;padding:14px;border:4px solid #57341e;border-radius:15px;font:inherit;font-size:18px;font-weight:1000;box-shadow:0 4px 0 #57341e;margin-top:9px;touch-action:manipulation}
.mainBtn{background:linear-gradient(#ffe56b,#ffb51f)}.subBtn{background:#fff}
.mainBtn:active,.subBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #57341e}
.stageCard{background:#fff7dc;border:4px solid #5a351c;border-radius:15px;padding:12px;margin:9px 0;box-shadow:0 4px 0 #71461f;touch-action:manipulation}.stageCard.locked{opacity:.5}.stageCard .n{font-size:17px;font-weight:1000}.stageCard .s{font-size:11px;color:#795a34;margin-top:3px}
.battle{padding:7px;background:#97cf68;min-height:calc(100svh - 65px)}

@keyframes boom{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(.7)}}

.hud{display:grid;grid-template-columns:.9fr 1.35fr .85fr;gap:5px;margin-top:5px}.hudbox{background:#fff0c8;border:3px solid #5b371e;border-radius:9px;padding:5px;text-align:center;font-weight:1000;font-size:11px}

.soundBtn{border:0;background:#dbeeff;border-radius:9px;padding:4px 8px;font-size:18px}

const $=id=>document.getElementById(id);
const el={
 topStage:$("topStage"),coinTop:$("coinTopValue"),stageList:$("stageList"),arena:$("arena"),
 enemy:$("enemySprite"),boom:$("boom"),life:$("lifeHearts"),hpText:$("hpText"),hpFill:$("hpFill"),
 coinHud:$("coinHud"),qStage:$("qStage"),qWord:$("qWord"),answers:$("answers"),feedback:$("feedback"),
 catGrid:$("catGrid"),clearText:$("clearText"),learnWord:$("learnWord"),learnMeaning:$("learnMeaning"),
 learnBtn:$("learnBtn"),notice:$("notice"),boo:$("booAudio")
};

let progress=Math.max(0,Math.min(Number(localStorage.getItem("nekoProgressIPhone")||0),STAGES.length-1));
let stageIndex=progress,coins=0,life=3,enemyHP=80,maxHP=80,currentQ=null,answerLocked=false;
let learnIndex=0,learnShown=false,audioUnlocked=false,activeTimers=new Set();

function later(fn,ms){const t=setTimeout(()=>{activeTimers.delete(t);fn()},ms);activeTimers.add(t);return t}
function clearTimers(){activeTimers.forEach(clearTimeout);activeTimers.clear()}
function show(id){clearTimers();document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
function note(t){el.notice.textContent=t;el.notice.style.display="block";later(()=>el.notice.style.display="none",1300)}

async function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 try{el.boo.volume=0.001;await el.boo.play();el.boo.pause();el.boo.currentTime=0;el.boo.volume=1}catch(e){}
}
function speak(t){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function playBoo(){try{el.boo.pause();el.boo.currentTime=0;el.boo.volume=1;const p=el.boo.play();if(p&&p.catch)p.catch(()=>note("消音モードや音量を確認してね"))}catch(e){}}
function ding(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.10;o.frequency.setValueAtTime(760,c.currentTime);o.frequency.linearRampToValueAtTime(1100,c.currentTime+.12);o.start();o.stop(c.currentTime+.16);later(()=>c.close(),300)}catch(e){}}

function stagePool(s){
 const p=DATA.filter(x=>x.type===s.type&&(!s.cat||x.cat.includes(s.cat))&&(!s.rank||x.rank===s.rank));
 return p.length?p:DATA;
}
function openMap(){
 show("map");el.stageList.replaceChildren();
 STAGES.forEach((s,i)=>{
  const card=document.createElement("div");card.className="stageCard"+(i>progress?" locked":"");
  const n=document.createElement("div");n.className="n";n.textContent=(i<progress?"✅ ":i===progress?"⚔️ ":"🔒 ")+(i+1)+". "+s.name;
  const d=document.createElement("div");d.className="s";d.textContent=s.chapter+" ｜ "+s.type+" "+s.cat+s.rank;
  card.append(n,d);
  if(i<=progress)card.addEventListener("click",()=>startStage(i));
  el.stageList.appendChild(card);
 });
}
function startStage(i){
 unlockAudio();stageIndex=i;const s=STAGES[i];coins=0;life=3;maxHP=enemyHP=s.hp;answerLocked=false;
 document.querySelectorAll(".unit").forEach(u=>u.remove());el.enemy.style.backgroundImage=`url("${ENEMY_POSES.taiki}")`;
 el.topStage.textContent=s.chapter.replace("　"," ")+" / "+s.name;el.qStage.textContent=(i+1)+". "+s.name;
 renderCats();updateHud();show("battle");later(nextQuestion,80);
}
function updateHud(){
 el.coinTop.textContent=coins;el.coinHud.textContent=coins;el.life.textContent="❤️".repeat(life)+"🖤".repeat(3-life);
 el.hpText.textContent=Math.max(0,enemyHP)+"/"+maxHP;el.hpFill.style.width=(Math.max(0,enemyHP)/maxHP*100)+"%";
 CATS.forEach((c,i)=>{const b=$("catBtn"+i);if(b)b.disabled=coins<c.cost});
}
function renderCats(){
 el.catGrid.replaceChildren();
 CATS.forEach((c,i)=>{
   const card=document.createElement("div");card.className="catCard"+(c.special?" special":"");
   const art=document.createElement("div");art.className="catArt";art.style.backgroundImage=`url("${CAT_POSES[c.id].taiki}")`;
   const name=document.createElement("div");name.className="catName";name.textContent=(c.special?"✨ ":"")+c.name;
   const st=document.createElement("div");st.className="catStats";st.innerHTML="🪙"+c.cost+"　攻"+c.atk+" / 速"+c.speed+"<br>"+c.desc;
   const b=document.createElement("button");b.className="deployBtn";b.id="catBtn"+i;b.textContent="出撃";b.addEventListener("click",()=>deploy(i));
   card.append(art,name,st,b);el.catGrid.appendChild(card);
 });
 updateHud();
}
function nextQuestion(){
 if(enemyHP<=0)return stageClear();if(life<=0)return gameOver();
 answerLocked=false;const p=stagePool(STAGES[stageIndex]);currentQ=p[Math.floor(Math.random()*p.length)];
 el.qWord.textContent=currentQ.en;el.answers.replaceChildren();el.feedback.textContent="正解してコインをためるにゃ！";
 let ch=[currentQ.jp],guard=0;
 while(ch.length<4&&guard<100){guard++;const x=p[Math.floor(Math.random()*p.length)].jp;if(x&&!ch.includes(x))ch.push(x)}
 while(ch.length<4)ch.push("？？？");
 for(let i=ch.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ch[i],ch[j]]=[ch[j],ch[i]]}
 ch.forEach(text=>{const b=document.createElement("button");b.textContent=text;b.addEventListener("click",()=>answer(text));el.answers.appendChild(b)});
 later(()=>speak(currentQ.en),80);
}
function answer(choice){
 if(answerLocked)return;answerLocked=true;el.answers.querySelectorAll("button").forEach(b=>b.disabled=true);
 if(choice===currentQ.jp){
  coins+=50;ding();el.feedback.textContent="⭕ 正解！ +50コイン！";updateHud();later(nextQuestion,620);
 }else{
  playBoo();life--;enemyHP=Math.min(maxHP,enemyHP+10);el.feedback.textContent="❌ まちがい… 敵HPが10回復！";
  el.enemy.style.backgroundImage=`url("${ENEMY_POSES.kougeki}")`;
  el.enemy.classList.remove("shake");void el.enemy.offsetWidth;el.enemy.classList.add("shake");updateHud();
  later(()=>el.enemy.style.backgroundImage=`url("${ENEMY_POSES.taiki}")`,330);later(nextQuestion,820);
 }
}
function deploy(i){
 const c=CATS[i];if(coins<c.cost)return;coins-=c.cost;updateHud();
 const u=document.createElement("div");u.className="unit";
 u.style.backgroundImage=`url("${CAT_POSES[c.id].hashiru}")`;
 el.arena.appendChild(u);
 el.feedback.textContent=(c.special?"✨ スペシャル！ ":"")+c.name+" 出撃！！";
 let x=57,goal=Math.max(235,el.arena.clientWidth-175),start=performance.now(),duration=Math.max(430,1250-c.speed*55);
 function frame(now){
   const t=Math.min(1,(now-start)/duration);
   x=57+(goal-57)*t;u.style.left=x+"px";
   if(t<1)requestAnimationFrame(frame);else attack(c,u);
 }
 requestAnimationFrame(frame);
}
function attack(c,u){
 u.style.backgroundImage=`url("${CAT_POSES[c.id].kougeki}")`;
 u.style.transform="scale(1.08)";
 enemyHP-=c.atk;
 el.enemy.style.backgroundImage=`url("${ENEMY_POSES.hashiru}")`;
 el.enemy.classList.remove("shake");el.boom.classList.remove("on");void el.enemy.offsetWidth;
 el.enemy.classList.add("shake");el.boom.classList.add("on");
 later(()=>el.enemy.style.backgroundImage=`url("${ENEMY_POSES.taiki}")`,260);
 if(c.id==="fuwa"){coins+=25;el.feedback.textContent="✨ フワねこ！ "+c.atk+"ダメージ ＆ +25コイン！"}
 else el.feedback.textContent=c.name+" の攻撃！ "+c.atk+"ダメージ！";
 updateHud();
 later(()=>{u.style.backgroundImage=`url("${CAT_POSES[c.id].taiki}")`;u.style.transform="scale(1)"},170);
 later(()=>u.remove(),430);
 if(enemyHP<=0)later(stageClear,520);
}
function stageClear(){
 if(stageIndex>=progress&&progress<STAGES.length-1){progress=stageIndex+1;localStorage.setItem("nekoProgressIPhone",String(progress))}
 el.clearText.textContent=STAGES[stageIndex].name+"を突破！ "+(stageIndex<STAGES.length-1?"次のステージが開いたにゃ！":"全ステージ制覇！");
 show("clear");
}
function gameOver(){el.answers.replaceChildren();el.feedback.textContent="💔 GAME OVER";later(openMap,1200)}
function startLearn(){learnIndex=0;show("learn");loadLearn()}
function loadLearn(){const q=DATA[learnIndex%DATA.length];el.learnWord.textContent=q.en;el.learnMeaning.textContent=q.jp;el.learnMeaning.hidden=true;el.learnBtn.textContent="正解は・・";learnShown=false;speak(q.en)}
function learnAction(){if(!learnShown){el.learnMeaning.hidden=false;el.learnBtn.textContent="次のことば ▶";learnShown=true}else{learnIndex++;loadLearn()}}

$("continueBtn").addEventListener("click",()=>{unlockAudio();startStage(progress)});
$("mapBtn").addEventListener("click",openMap);
$("learnOpenBtn").addEventListener("click",()=>{unlockAudio();startLearn()});
$("mapBackBtn").addEventListener("click",()=>show("home"));
$("battleBackBtn").addEventListener("click",()=>show("home"));
$("battleMapBtn").addEventListener("click",openMap);
$("clearHomeBtn").addEventListener("click",()=>show("home"));
$("nextStageBtn").addEventListener("click",()=>startStage(Math.min(stageIndex+1,STAGES.length-1)));
$("learnBtn").addEventListener("click",learnAction);
$("learnBackBtn").addEventListener("click",()=>show("home"));
$("speakBtn").addEventListener("click",()=>{unlockAudio();if(currentQ)speak(currentQ.en)});
$("zukanBtn").addEventListener("click",()=>note("ねこ図鑑は次に追加するにゃ！"));
$("menuBtn").addEventListener("click",()=>note("メニューは次に追加するにゃ！"));

window.addEventListener("error",e=>{console.log(e.error||e.message);note("うまく動かなかったにゃ。もう一度タップしてね")});

// first touch unlock for iPhone Safari
document.addEventListener("touchstart",unlockAudio,{once:true,passive:true});
</script></body></html>
